<button type="button" class="yaw-zone zone" (click)="toggle.emit()" [attr.aria-expanded]="open()"
  [attr.aria-label]="'Garaż, dostępne wózki: ' + forkliftIds().length">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 20V9l9-5 9 5v11"></path><path d="M7 20v-6h10v6"></path><path d="M7 17h10"></path></svg>
  GARAŻ
  <span class="swatches" aria-hidden="true">
    @for (forklift of forklifts(); track forklift.id) {
      <span class="swatch" [style.background]="forklift.color"></span>
    }
  </span>
</button>

@if (open()) {
  <app-panel-popup class="popup" [title]="'GARAŻ (' + forkliftIds().length + ')'" (close)="toggle.emit()">
    @if (forklifts().length > 0) {
      <table class="yaw-table">
        <thead>
          <tr><th>Wózek</th><th>Status</th></tr>
        </thead>
        <tbody>
          @for (forklift of forklifts(); track forklift.id) {
            <tr>
              <td>
                <span class="forklift">
                  <span class="swatch" [style.background]="forklift.color"></span>
                  <span class="yaw-num">#{{ forklift.id }}</span>
                </span>
              </td>
              <td><span class="yaw-chip yaw-chip--tan">DOSTĘPNY</span></td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="yaw-empty">Wszystkie wózki są w trasie.</p>
    }
  </app-panel-popup>
}
