<button type="button" class="yaw-zone zone" (click)="toggle.emit()" [attr.aria-expanded]="open()"
  [attr.aria-label]="'Strefa wydań, paczki: ' + packages().length">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M10 7h11v9H10z"></path><path d="M10 10H6l-3 3v3h7"></path><circle cx="7" cy="18" r="1.8"></circle><circle cx="17" cy="18" r="1.8"></circle></svg>
  WYDANIA
  @if (packages().length > 0) {
    <span class="yaw-zone__badge badge" aria-hidden="true">{{ packages().length }}</span>
  }
</button>

@if (open()) {
  <app-panel-popup class="popup" [title]="'STREFA WYDAŃ (' + packages().length + ')'" subtitle="Wydane w tej sesji przeglądarki" (close)="toggle.emit()">
    @if (packages().length > 0) {
      <table class="yaw-table">
        <thead>
          <tr><th>ID</th><th>Nazwa</th><th>Status</th><th>Zlecenie</th></tr>
        </thead>
        <tbody>
          @for (pkg of packages(); track pkg.id) {
            @let status = statusView(pkg.status);
            <tr>
              <td class="yaw-num">{{ pkg.id }}</td>
              <td>{{ pkg.name }}</td>
              <td><span class="yaw-chip" [class]="'yaw-chip--' + status.variant">{{ status.label }}</span></td>
              <td class="yaw-num">#{{ pkg.outboundOrderId ?? pkg.inboundOrderId }}</td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="yaw-empty">W tej sesji nic jeszcze nie wydano.</p>
    }
  </app-panel-popup>
}
