<div class="packages-section">
    <h3>Paczki w zamówieniu #{{ orderId() }}</h3>

    <div class="packages-table">
        <table mat-table [dataSource]="packages() ?? []" class="mat-shadow-2">

            <ng-container matColumnDef="ID">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let packageItem"> {{ packageItem.id }} </td>
            </ng-container>

            <ng-container matColumnDef="Nazwa">
                <th mat-header-cell *matHeaderCellDef> Nazwa </th>
                <td mat-cell *matCellDef="let packageItem"> {{ packageItem.name }} </td>
            </ng-container>

            <ng-container matColumnDef="Status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let packageItem"> {{ packageItem.status }} </td>
            </ng-container>

            <ng-container matColumnDef="Pozycja">
                <th mat-header-cell *matHeaderCellDef> Pozycja </th>
                <td mat-cell *matCellDef="let packageItem"> ({{ packageItem.x }}, {{ packageItem.y }}) </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
