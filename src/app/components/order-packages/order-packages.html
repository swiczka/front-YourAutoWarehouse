<div class="packages-section">
    <h3>PACZKI W ZLECENIU #{{ orderId() }}</h3>

    <div class="packages-table yaw-scroll">
        <table class="yaw-table">
            <thead>
                <tr><th>ID</th><th>Nazwa</th><th>Status</th><th>Pozycja</th></tr>
            </thead>
            <tbody>
                @for (packageItem of packages() ?? []; track packageItem.id) {
                    @let status = statusView(packageItem.status);
                    <tr>
                        <td class="yaw-num">{{ packageItem.id }}</td>
                        <td>{{ packageItem.name }}</td>
                        <td><span class="yaw-chip" [class]="'yaw-chip--' + status.variant">{{ status.label }}</span></td>
                        <td class="yaw-num nowrap">({{ packageItem.x }}, {{ packageItem.y }})</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
