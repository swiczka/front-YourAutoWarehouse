@let packageItem = this.package();
@let status = this.status();
<app-panel-popup [title]="'PACZKA „' + packageItem.name + '”'" (close)="close.emit()">
  <table class="yaw-table">
    <thead>
      <tr><th>ID</th><th>Nazwa</th><th>Status</th><th>Zlecenie</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="yaw-num">{{ packageItem.id }}</td>
        <td>{{ packageItem.name }}</td>
        <td><span class="yaw-chip" [class]="'yaw-chip--' + status.variant">{{ status.label }}</span></td>
        <td class="yaw-num">#{{ packageItem.inboundOrderId }}</td>
      </tr>
    </tbody>
  </table>
</app-panel-popup>
