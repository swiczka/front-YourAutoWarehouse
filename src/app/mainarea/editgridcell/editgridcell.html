@if (selected() && grownFrom() !== null) {
    <span class="road-grow" [class.road-grow--x]="growAxis() === 'x'" [style.transform-origin]="growOrigin()"></span>
}
@if (extendFrom()) {
    <button type="button" class="extend" (click)="extend()"
        [attr.aria-label]="'Dodaj drogę na polu ' + coordinate().x + ', ' + coordinate().y">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" [style.transform]="arrowRotation()"><path d="M12 20V5M5 11l7-7 7 7"></path></svg>
    </button>
}
@if (showCoordinates()) {
    <span class="coords">{{coordinate().x}}, {{coordinate().y}}</span> <!-- temporary -->
}
