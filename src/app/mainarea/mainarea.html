@if (drawingModeEnabled()) {
<app-layout-editor />
} @else {
<div class="control-room">
    <section class="hall" aria-label="Hala magazynu">
        <app-hall-header />
        <app-warehouse-map />
    </section>

    <aside class="side" aria-label="Zlecenia">
        @if (layoutId(); as currentId) {
            <app-orders-panel [layoutId]="currentId" />
        }
        <app-event-feed class="side__feed" />
    </aside>
</div>
}
